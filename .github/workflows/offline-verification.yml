name: Offline candidate verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

env:
  # On a PR, github.sha is the synthetic merge commit, not the candidate head.
  CANDIDATE_SHA: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}

jobs:
  common:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          fetch-depth: 0 # Archived snapshots from the released v0.3.0 and v0.4.0 trees.
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Verify exact candidate with only Go, Git and race toolchain on PATH
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          goroot="$(go env GOROOT)"
          isolated="$(mktemp -d "$RUNNER_TEMP/nstack-go.XXXXXX")"
          mkdir "$isolated/bin" "$isolated/home" "$isolated/tmp" "$isolated/cache"
          for command in git gcc as ld cat mkdir; do
            ln -s "$(command -v "$command")" "$isolated/bin/$command"
          done
          offline() {
            env -i HOME="$isolated/home" PATH="$goroot/bin:$isolated/bin" TMPDIR="$isolated/tmp" \
              GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_ALLOW_PROTOCOL=file \
              GOTOOLCHAIN=local GOPROXY=off GOSUMDB=off GOCACHE="$isolated/cache" \
              CGO_ENABLED=1 CC=gcc "$@"
          }
          offline go version
          unformatted="$(offline gofmt -l distribution.go distribution_test.go cmd internal)"
          if [ -n "$unformatted" ]; then
            printf 'Files requiring gofmt:\n%s\n' "$unformatted" >&2
            exit 1
          fi
          offline go vet -mod=vendor ./...
          offline go test -mod=vendor ./...
          # ubuntu-24.04 uses Linux amd64 here and has the C toolchain for -race.
          offline go test -mod=vendor -race ./...
      - name: Verify reproducible Linux distribution and Python-free runtime
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          goroot="$(go env GOROOT)"
          work="$(mktemp -d "$RUNNER_TEMP/nstack-dist.XXXXXX")"
          mkdir "$work/home" "$work/cache-first" "$work/cache-rebuild" "$work/source" "$work/tmp"
          git archive "$CANDIDATE_SHA" | tar -xf - -C "$work/source"
          build() {
            env -i HOME="$work/home" PATH="$goroot/bin" TMPDIR="$work/tmp" \
              GOCACHE="$3" GOTOOLCHAIN=local GOPROXY=off GOSUMDB=off \
              CGO_ENABLED=0 GOOS=linux GOARCH="$1" GOAMD64=v1 GOARM64=v8.0 \
              "$goroot/bin/go" build -mod=vendor -trimpath -buildvcs=false -o "$2" ./cmd/nstack-codex
          }
          for arch in amd64 arm64; do
            build "$arch" "$work/nstack-linux-$arch" "$work/cache-first"
            (cd "$work/source"; build "$arch" "$work/rebuilt-$arch" "$work/cache-rebuild")
            cmp "$work/nstack-linux-$arch" "$work/rebuilt-$arch"
          done
          (cd "$work"; sha256sum nstack-linux-amd64 nstack-linux-arm64 > SHA256SUMS; sha256sum -c SHA256SUMS)
          nstack() { env -i PATH= HOME="$work/home" "$work/nstack-linux-amd64" "$@"; }
          nstack --version
          for id in first second; do
            nstack install --home "$work/home" stage "$id"
            nstack install --home "$work/home" activate "$id"
          done
          test "$(readlink "$work/home/skills/nstack-managed")" = "$work/home/nstack/snapshots/second/skills"
          nstack install --home "$work/home" activate first
          test "$(readlink "$work/home/skills/nstack-managed")" = "$work/home/nstack/snapshots/first/skills"
          cmp LICENSE "$work/home/nstack/snapshots/first/LICENSE"
          cmp LICENSE-upstream "$work/home/nstack/snapshots/first/LICENSE-upstream"
          for id in first second; do
            nstack install --harness opencode --home "$work/opencode" stage "$id"
            nstack install --harness opencode --home "$work/opencode" activate "$id"
          done
          test "$(readlink "$work/opencode/skills/nstack-managed")" = "$work/opencode/nstack/snapshots/second/skills"
          nstack install --harness opencode --home "$work/opencode" activate first
          test "$(readlink "$work/opencode/skills/nstack-managed")" = "$work/opencode/nstack/snapshots/first/skills"
          test "$(readlink "$work/home/skills/nstack-managed")" = "$work/home/nstack/snapshots/first/skills"
          printf '%s\n' '{"data":[{"model":"gpt-6.2-astra","supportedReasoningEfforts":[{"reasoningEffort":"medium"}]}]}' |
            nstack check-role "$work/home/nstack/snapshots/first/examples/agents/nstack_review.toml"
          # Rebuild the pinned v0.4.0 installer and reconstruct the exact
          # v0.3.0 payload layout from its release, without invoking Python.
          mkdir "$work/previous" "$work/home/nstack/snapshots/v030"
          git archive 97fc046dc784c3e4586ec13795cf2dedd9397315 | tar -xf - -C "$work/previous"
          git archive bb8206a95bffb8908d75be8538e3e106bf280266 -- \
            skills adapters docs examples/agents LICENSE LICENSE-upstream README.md README.ja.md |
            tar -xf - -C "$work/home/nstack/snapshots/v030"
          (cd "$work/previous"; build amd64 "$work/nstack-v040" "$work/cache-first")
          previous() { env -i PATH= HOME="$work/home" "$work/nstack-v040" "$@"; }
          previous install --home "$work/home" stage v040
          previous install --home "$work/home" activate v040
          nstack install --home "$work/home" activate second
          nstack install --home "$work/home" activate v040
          test "$(readlink "$work/home/skills/nstack-managed")" = "$work/home/nstack/snapshots/v040/skills"
          nstack install --home "$work/home" activate v030
          nstack install --home "$work/home" activate second
          nstack install --home "$work/home" activate v030
          test "$(readlink "$work/home/skills/nstack-managed")" = "$work/home/nstack/snapshots/v030/skills"
          previous install --harness opencode --home "$work/opencode" stage v040
          previous install --harness opencode --home "$work/opencode" activate v040
          nstack install --harness opencode --home "$work/opencode" activate second
          nstack install --harness opencode --home "$work/opencode" activate v040
          test "$(readlink "$work/opencode/skills/nstack-managed")" = "$work/opencode/nstack/snapshots/v040/skills"
          test "$(readlink "$work/home/skills/nstack-managed")" = "$work/home/nstack/snapshots/v030/skills"
          if find "$work/home/nstack/snapshots/second" "$work/opencode/nstack/snapshots/second" -name '*.py' | grep -q .; then
            echo 'Unexpected Python assets in the current snapshot' >&2
            exit 1
          fi
  validate:
    needs: common
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CODEX_VERSION: "0.172.0"
      CODEX_ARCHIVE_SHA256: a2342a8f7f68f088be30620ccfe9cb84162c93a6b56177855961cda3ed6be392
      CODEX_EXEC_SERVER_ARCHIVE_SHA256: 1276ea8882a5c96fbc35fdb57c169198fe95f845dab0be864a8a0bc026efa8d5
    steps:
      - name: Require common verification
        env:
          COMMON_RESULT: ${{ needs.common.result }}
        run: test "$COMMON_RESULT" = success
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Enable Ubuntu's restricted Bubblewrap profile
        shell: bash
        run: |
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apparmor-profiles bubblewrap
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test "$(dpkg-query --search "$profile")" = "apparmor-profiles: $profile"
          test "$(dpkg-query --search /usr/bin/bwrap)" = "bubblewrap: /usr/bin/bwrap"
          sudo apparmor_parser --replace "$profile"
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          confined="$(/usr/bin/bwrap --unshare-user --unshare-pid --unshare-net --ro-bind / / --proc /proc -- /bin/cat /proc/self/attr/current)"
          test "$confined" = 'bwrap//&unpriv_bwrap (enforce)'
      - name: Install pinned validation tools
        shell: bash
        run: |
          tool_dir="$(mktemp -d "$RUNNER_TEMP/nstack-tools.XXXXXX")"
          mkdir "$tool_dir/bin"
          install_component() {
            local name="$1" checksum="$2" destination="$3" asset archive
            asset="${name}-x86_64-unknown-linux-musl"
            archive="$tool_dir/$asset.tar.gz"
            curl --fail --silent --show-error --location --retry 3 \
              "https://github.com/openai/codex/releases/download/rust-v${CODEX_VERSION}/${asset}.tar.gz" \
              --output "$archive"
            printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check
            tar -xzf "$archive" -C "$tool_dir" "$asset"
            install -m 0755 "$tool_dir/$asset" "$tool_dir/$destination"
          }
          install_component codex "$CODEX_ARCHIVE_SHA256" bin/codex
          # The exec server stays next to Codex. Use Ubuntu's confined bwrap.
          install_component codex-exec-server "$CODEX_EXEC_SERVER_ARCHIVE_SHA256" bin/codex-exec-server
          printf '%s\n' "$tool_dir/bin" >> "$GITHUB_PATH"
      - name: Verify exact candidate without provider credentials
        shell: bash
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$CANDIDATE_SHA"
          cli_version="$(codex --version)"
          test "$cli_version" = "codex-cli $CODEX_VERSION"
          {
            echo '### Offline candidate verification'
            printf '\n- Event: `%s`\n- Candidate SHA: `%s`\n- Codex: `%s`\n' "$GITHUB_EVENT_NAME" "$actual_sha" "$cli_version"
            printf -- '- Go: `%s`\n- Git: `%s`\n' "$(go version)" "$(git --version)"
            echo '- Evidence: native Codex offline discovery, configuration, sandbox and cancellation. Zero authenticated model turns.'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          goroot="$(go env GOROOT)"
          isolated="$(mktemp -d "$RUNNER_TEMP/nstack-native.XXXXXX")"
          mkdir "$isolated/bin" "$isolated/home" "$isolated/tmp" "$isolated/cache"
          for command in codex codex-exec-server git; do
            ln -s "$(command -v "$command")" "$isolated/bin/$command"
          done
          ln -s /usr/bin/bwrap "$isolated/bin/bwrap"
          env -i HOME="$isolated/home" CODEX_HOME="$isolated/home" PATH="$goroot/bin:$isolated/bin" \
            TMPDIR="$isolated/tmp" GOCACHE="$isolated/cache" GOTOOLCHAIN=local GOPROXY=off GOSUMDB=off \
            CGO_ENABLED=0 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_ALLOW_PROTOCOL=file \
            NSTACK_CODEX_NATIVE_TEST=offline "$goroot/bin/go" test -mod=vendor -v ./internal/codex -run '^TestNativeOffline'
